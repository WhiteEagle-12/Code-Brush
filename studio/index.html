<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code-Brush Studio</title><style>
:root{color-scheme:dark;--bg:#111c1a;--panel:#1b2a25;--line:#3b4c40;--text:#eee6d3;--gold:#dbb776;--muted:#a0b1a4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}header{display:flex;justify-content:space-between;align-items:center;padding:22px 3vw;border-bottom:1px solid var(--line)}header b{letter-spacing:4px}main{display:grid;grid-template-columns:200px minmax(320px,1fr) 300px;gap:20px;padding:24px 3vw;max-width:2000px;margin:auto}aside,.editor{background:var(--panel);padding:18px;border:1px solid var(--line);border-radius:8px}h1{font:30px Georgia;margin:0 0 10px}h2{font:19px Georgia;margin:0 0 15px}button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--text);padding:8px}button{cursor:pointer}button:hover{border-color:var(--gold)}button.active,.primary{background:var(--gold);color:#19251e}#image{width:100%;display:block;background:#080e0b;border-radius:7px}input[type=range]{width:100%;accent-color:var(--gold);padding:0}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}textarea{width:100%;font:12px ui-monospace,monospace;resize:vertical}#nodes button{display:block;width:100%;text-align:left;margin:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:14px 0}.time{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--gold)}#shots{display:flex;gap:3px;margin-top:13px}#shots button{flex:1;font-size:12px;text-align:left;border-top:3px solid var(--gold)}small,#status{color:var(--muted);line-height:1.6}#status{padding:12px 0;min-height:44px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fields input{width:100%}.wide{width:100%;margin-top:12px}.editor select{width:100%}@media(max-width:1050px){main{grid-template-columns:150px minmax(300px,1fr)}.editor{grid-column:1/-1}}@media(max-width:650px){main{display:block;padding:16px}aside{margin-bottom:15px}#nodes{display:flex;overflow:auto;gap:5px}#nodes button{min-width:120px}.editor{margin-top:15px}}
</style></head><body><header><b>◒ CODE-BRUSH</b><span>PRODUCTION STUDIO</span><button id="validate">Validate project</button></header><main><aside><h2>Scene</h2><div id="nodes"></div><button id="add" class="wide">+ Add drawing layer</button><label>Saved revisions</label><select id="revisions"></select><button id="restore" class="wide">Restore revision</button></aside><section><h1 id="title">Loading…</h1><small>Scrub poses, edit drawing data, set keyframes, and save revisions.</small><img id="image" alt="Rendered animation frame"><div class="controls"><button id="play" class="primary">▶ Preview</button><button id="prev">← Frame</button><button id="next">Frame →</button><button id="onion">Onion skin</button><button id="guides">Rig guides</button><span class="time" id="time">0.000s</span></div><input id="timeline" aria-label="Timeline" type="range" min="0" max="10" step="0.0416667" value="0"><div id="shots"></div><div id="status">Ready.</div><small>Live preview follows render speed. Review an encoded movie for exact playback and audio.</small></section><section class="editor"><h2 id="selected">Select a node</h2><div class="fields" id="fields"></div><button id="key" class="wide primary">Keyframe these transforms</button><button id="save" class="wide">Save base transforms</button><label>Node drawing / rig JSON</label><textarea id="json" rows="16" spellcheck="false"></textarea><button id="saveJson" class="wide">Save node JSON</button><label>Keyframe easing</label><select id="ease"><option>smooth</option><option>linear</option><option>smoother</option><option>in</option><option>out</option><option>hold</option></select></section></main><script>
let state,current,nodeId,timeValue=0,onion=false,guides=false,sequence=0,playing=false,playToken=0;const $=id=>document.getElementById(id);
async function api(method,args={}){const r=await(await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method,args})})).json();if(!r.ok)throw Error(r.error);return r.result;}
function all(nodes,out=[]){for(const n of nodes||[]){out.push(n);all(n.children,out);if(n.mask)all([n.mask],out);for(const s of n.slots||[])all([s.node],out);}return out;}
function status(text){$('status').textContent=text;}
async function reload(){state=await api('project.read');$('title').textContent=state.project.title;$('timeline').max=state.project.duration-1/state.project.fps;$('timeline').step=1/state.project.fps;$('nodes').replaceChildren();for(const n of all(state.project.nodes)){const b=document.createElement('button');b.textContent=n.id;b.onclick=()=>select(n.id);$('nodes').append(b);}$('shots').replaceChildren();for(const s of state.project.shots||[]){const b=document.createElement('button');b.textContent=s.id+' · '+s.start+'s';b.onclick=()=>seek(s.start);$('shots').append(b);}const revisions=await api('project.revisions');$('revisions').replaceChildren();for(const r of revisions.revisions)$('revisions').add(new Option(r.slice(0,12),r));if(nodeId)select(nodeId);await frame();}
async function frame(){const seq=++sequence;const response=await fetch('/frame?time='+timeValue+'&onion='+(+onion)+'&guides='+(+guides));if(!response.ok)throw Error('Frame rendering failed');const blob=await response.blob();if(seq!==sequence)return;const old=$('image').src;$('image').src=URL.createObjectURL(blob);if(old.startsWith('blob:'))URL.revokeObjectURL(old);$('time').textContent=timeValue.toFixed(3)+'s';$('timeline').value=timeValue;}
function select(id){nodeId=id;current=all(state.project.nodes).find(n=>n.id===id);if(!current)return;$('selected').textContent=id;$('json').value=JSON.stringify(current,null,2);$('fields').replaceChildren();for(const prop of['x','y','rotation','scale','opacity']){const wrap=document.createElement('div'),label=document.createElement('label'),input=document.createElement('input');label.textContent=prop;input.type='number';input.step='.01';input.value=current[prop]??(['scale','opacity'].includes(prop)?1:0);input.dataset.prop=prop;wrap.append(label,input);$('fields').append(wrap);}}
async function seek(t){timeValue=Math.max(0,Math.min(state.project.duration-1/state.project.fps,t));await frame();}
async function edit(operations){const result=await api('project.edit',{expectedRevision:state.revision,operations});status('Saved revision '+result.revision.slice(0,12));await reload();}
$('timeline').oninput=()=>seek(+$('timeline').value).catch(e=>status(e.message));$('prev').onclick=()=>seek(timeValue-1/state.project.fps);$('next').onclick=()=>seek(timeValue+1/state.project.fps);
$('play').onclick=async()=>{playing=!playing;const token=++playToken;$('play').textContent=playing?'Ⅱ Pause':'▶ Preview';try{while(playing&&token===playToken){await seek(timeValue>=state.project.duration-1/state.project.fps?0:timeValue+1/state.project.fps);}}catch(e){playing=false;$('play').textContent='▶ Preview';status(e.message);}};
for(const id of['onion','guides'])$(id).onclick=()=>{if(id==='onion')onion=!onion;else guides=!guides;$(id).classList.toggle('active');frame();};
for(const mode of['key','save'])$(mode).onclick=()=>{if(!current)return;const operations=[...$('fields').querySelectorAll('input')].map(i=>({op:mode==='key'?'key':'set',target:nodeId,property:i.dataset.prop,value:+i.value,time:timeValue,ease:$('ease').value}));edit(operations).catch(e=>status(e.message));};
$('saveJson').onclick=()=>{try{const replacement=JSON.parse($('json').value);if(replacement.id!==nodeId)throw Error('Keep the node id unchanged');const next=structuredClone(state.project);function replace(nodes){for(let i=0;i<(nodes||[]).length;i++){if(nodes[i].id===nodeId){nodes[i]=replacement;return true;}if(replace(nodes[i].children))return true;if(nodes[i].mask){if(nodes[i].mask.id===nodeId){nodes[i].mask=replacement;return true;}if(replace([nodes[i].mask]))return true;}for(const slot of nodes[i].slots||[]){if(slot.node.id===nodeId){slot.node=replacement;return true;}if(replace([slot.node]))return true;}}}replace(next.nodes);edit([{op:'replace',value:next}]).catch(e=>status(e.message));}catch(e){status(e.message);}};
$('add').onclick=()=>{const id='drawing-'+Date.now().toString(36);edit([{op:'add',node:{id,type:'path',x:state.project.width/2,y:state.project.height/2,commands:[['M',-50,40],['Q',0,-80,50,40],['Z']],fill:'#bf7548'}}]).then(()=>select(id)).catch(e=>status(e.message));};
$('restore').onclick=()=>api('project.restore',{revision:$('revisions').value,expectedRevision:state.revision}).then(reload).catch(e=>status(e.message));$('validate').onclick=()=>api('project.validate').then(r=>status('Valid · '+r.nodes+' nodes · '+r.frames+' frames'+(r.warnings.length?' · '+r.warnings.join(';'):''))).catch(e=>status(e.message));
reload().catch(e=>status(e.message));
</script></body></html>
