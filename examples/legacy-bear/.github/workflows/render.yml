name: Test and render
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  film:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: the-other-side
          path: |
            output/the-other-side.mp4
            output/the-other-side.render.json
